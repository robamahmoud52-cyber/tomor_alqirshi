<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلباتي - تمور القريشي</title>
<style>
body{font-family:system-ui;background:#fdfaf6;margin:0;padding:20px}
.box{max-width:600px;margin:auto}
.card{background:#fff;border-radius:18px;padding:16px;margin:14px 0;border:1px solid #eee;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.st{padding:6px 14px;border-radius:20px;font-size:13px;display:inline-block;margin-top:8px}
.pending{background:#fff3cd}
.reviewed{background:#cce5ff;color:#004085;font-weight:bold}
.preparing{background:#ffe0b2}
.ready{background:#d4edda;color:#155724}
.delivered{background:#155724;color:#fff}
</style>
</head>
<body>
<div class="box">
<h2>📦 طلباتي</h2>
<a href="/" style="color:#8B5A2B;text-decoration:none">← الرجوع للمتجر</a>
<div id="list" style="margin-top:20px">جاري تحميل طلباتك...</div>
</div>
<script>
const labels = {
 pending: 'تم استلام طلبك ✅ بنراجعه قريباً',
 reviewed: 'تمت المراجعة 🔍 وجاري التجهيز',
 preparing: 'قيد التجهيز 📦',
 ready: 'تم التجهيز وجاهز للتوصيل 🚚',
 delivered: 'تم التسليم ✅ شكراً لك'
};
async function load(){
 let ids = JSON.parse(localStorage.getItem('my_orders_ids') || '[]');
 let el = document.getElementById('list');
 if(!ids.length){
   el.innerHTML = '<p style="text-align:center;margin-top:50px">ما عندك طلبات حالياً<br><br><a href="/" style="background:#8B5A2B;color:#fff;padding:12px 22px;border-radius:12px;text-decoration:none">تسوق الآن</a></p>';
   return;
 }
 try{
  let res = await fetch('/api/my-orders-list?ids=' + encodeURIComponent(ids.join(',')));
  let data = await res.json();
  if(!data.orders || !data.orders.length){
    el.innerHTML = '<p>الطلبات محفوظة في جوالك لكن السيرفر انمسح (Render المجاني يمسح). اطلب مرة ثانية.</p>';
    return;
  }
  el.innerHTML = data.orders.reverse().map(o => `
    <div class="card">
      <b>طلب #${o.order_no || o.id}</b>
      <div style="color:#888;font-size:12px">${new Date(o.created_at || Date.now()).toLocaleString('ar-SA')}</div>
      <div><span class="st ${o.status || 'pending'}">${labels[o.status] || o.status}</span></div>
      <div style="margin-top:8px;font-size:13px;color:#555">${(o.items||[]).map(i=> (i.type_ar||i.type||'تمر') + ' x' + (i.qty||1)).join(' ، ')}</div>
      <div style="margin-top:6px;color:#8B5A2B;font-weight:bold">الإجمالي: ${o.total||0} ر.س</div>
    </div>
  `).join('');
 }catch(e){
  el.innerHTML = 'خطأ: ' + e.message;
 }
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
