<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طلباتي - تمور القرشي</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#fdfaf6;margin:0;padding:20px}
.box{max-width:600px;margin:0 auto}
.order-card{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.status{padding:6px 12px;border-radius:20px;font-size:13px;display:inline-block;margin-top:8px}
.pending{background:#fff3cd;color:#856404}
.review{background:#cce5ff;color:#004085}
.preparing{background:#ffe0b2;color:#7a4100}
.ready{background:#d4edda;color:#155724}
.delivered{background:#155724;color:#fff}
.steps{display:flex;justify-content:space-between;margin:12px 0 0 0;font-size:11px}
.steps div{text-align:center;flex:1;opacity:0.3}
.steps div.active{opacity:1;font-weight:bold;color:#8B5A2B}
.top{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <h2>طلباتي 📦</h2>
    <a href="index.html">← رجوع للمتجر</a>
  </div>
  <div id="ordersList"></div>
</div>

<script>
const STATUS_TEXT = {
  pending: 'تم استلام الطلب',
  review: 'تمت المراجعة',
  preparing: 'قيد التجهيز',
  ready: 'تم التجهيز - جاهز للتسليم',
  delivered: 'تم التسليم'
};
const STATUS_CLASS = {
  pending: 'pending',
  review: 'review',
  preparing: 'preparing',
  ready: 'ready',
  delivered: 'delivered'
};

function loadMyOrders(){
  const orders = JSON.parse(localStorage.getItem('QC_ORDERS') || '[]');
  const container = document.getElementById('ordersList');
  
  if(orders.length === 0){
    container.innerHTML = '<p style="text-align:center;margin-top:50px">ما عندك طلبات سابقة حتى الآن.<br>اطلب الحين وبتظهر هنا.</p>';
    return;
  }

  // اعرض من الاحدث للاقدم
  container.innerHTML = orders.reverse().map(order => `
    <div class="order-card">
      <div style="display:flex;justify-content:space-between">
        <strong>${order.id || 'TQ-' + order.date}</strong>
        <small>${order.date}</small>
      </div>
      <div style="margin:8px 0;color:#666;font-size:14px">
        ${order.items ? order.items.map(i=> i.name + ' - ' + i.qty).join('<br>') : 'تفاصيل الطلب'}
      </div>
      <div class="steps">
        ${['pending','review','preparing','ready','delivered'].map((s, idx) => {
          const currentIdx = ['pending','review','preparing','ready','delivered'].indexOf(order.status || 'pending');
          return `<div class="${idx <= currentIdx ? 'active' : ''}">${idx+1}. ${STATUS_TEXT[s].split(' ')[0]}</div>`;
        }).join('')}
      </div>
      <span class="status ${STATUS_CLASS[order.status || 'pending']}">${STATUS_TEXT[order.status || 'pending']}</span>
    </div>
  `).join('');
}
loadMyOrders();
</script>
</body>
</html>
